<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c120a"/>
      <stop offset="100%" stop-color="#090502"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7b3d" stop-opacity="1"/>
      <stop offset="50%" stop-color="#e86026" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9469ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8c42"/>
      <stop offset="50%" stop-color="#e86026"/>
      <stop offset="100%" stop-color="#9469ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Outer Breathing Rings -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="url(#ringGrad)" stroke-width="4" opacity="0.45" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#e86026" stroke-width="6" opacity="0.75"/>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="100" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Sacred Geometry Lotus Petals -->
  <g transform="translate(256,256) scale(0.95)" fill="none" stroke="#ffebd4" stroke-width="2.5" opacity="0.9">
    <!-- Petal Pair 1 -->
    <path d="M0,-95 Q40,-45 0,0 Q-40,-45 0,-95" fill="url(#coreGlow)" opacity="0.6"/>
    <path d="M0,95 Q40,45 0,0 Q-40,45 0,95" fill="url(#coreGlow)" opacity="0.6"/>
    <!-- Petal Pair 2 -->
    <path d="M-95,0 Q-45,40 0,0 Q-45,-40 -95,0" fill="url(#coreGlow)" opacity="0.6"/>
    <path d="M95,0 Q45,40 0,0 Q45,-40 95,0" fill="url(#coreGlow)" opacity="0.6"/>
    <!-- Diagonal Petals -->
    <g transform="rotate(45)">
      <path d="M0,-80 Q32,-40 0,0 Q-32,-40 0,-80" opacity="0.4"/>
      <path d="M0,80 Q32,40 0,0 Q-32,40 0,80" opacity="0.4"/>
      <path d="M-80,0 Q-40,32 0,0 Q-40,-32 -80,0" opacity="0.4"/>
      <path d="M80,0 Q40,32 0,0 Q40,-32 80,0" opacity="0.4"/>
    </g>
  </g>

  <!-- Luminous Inner Core Dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#ffebd4"/>
</svg>
